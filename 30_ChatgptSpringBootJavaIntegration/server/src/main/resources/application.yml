
  # ===================================================================
  # SECURITY UPDATE: Credentials externalized to Environment Variables
  # Prevented hardcoded sensitive data vulnerability.
  # ===================================================================
  server:
    port: 80
  openai:
    model: gpt-5.6-luna
    api:
      key: ${OPENAI_API_KEY}
      url: https://api.openai.com/v1/chat/completions
  cors:
    originPatterns: http://localhost:8080,http://localhost:3000,http://localhost:3001,http://localhost:8888,http://localhost:80,https://www.erudio.com.br
  file:
    # Secure fallback to create a local directory if the UPLOAD_DIR variable is empty
    upload-dir: ${UPLOAD_DIR:./uploads}
  security:
    jwt:
      token:
        secret-key: 53cr37
        expire-length: 3600000
  email:
    subject: "Default Subject"
    message: "Default Message"
  spring:
    application:
      name: rest-with-spring-boot-and-java-erudio
    flyway:
      connect-retries: 10
    datasource:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # Lê URL_DOCKER_DB do Docker Compose ou recua para URL_DB (uso local)
      url: ${URL_DOCKER_DB:${URL_DB}}
      username: ${DATABASE_USER:${DATABASE_DOCKER_USER}}
      password: ${DATABASE_PASS:${DATABASE_DOCKER_PASS}}
      hikari:
        initialization-fail-timeout: 60000
    jpa:
      hibernate:
        ddl-auto: none
      properties:
        hibernate:
      show-sql: false
      open-in-view: false
    mail:
      # SMTP credentials secured via system environment variables
      host: smtp.gmail.com
      port: 587
      username: ${EMAIL_USERNAME}
      password: ${EMAIL_PASSWORD}
      properties:
        mail.smtp.auth: true
        mail.smtp.starttls.enabled: true
        mail.smtp.starttls.required: true
    servlet:
      multipart:
        enabled: true
        file-size-threshold: 2KB
        max-file-size: 200MB
        max-request-size: 215 MB
  logging:
    level:
      root: INFO
      # net.sf.jasperreports.engine.*: TRACE
      # root: WARN
      # br.com.erudio: DEBUG
  spring-doc:
    paths-to-match:
      - /auth/**
      - /api/**/v1/**
    swagger-ui:
      use-root-path: true