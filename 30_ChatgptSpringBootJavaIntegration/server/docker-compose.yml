services:
  db:
    image: mysql:9.7.2
    container_name: server-db-1
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASS}
      MYSQL_USER: ${DATABASE_DOCKER_USER}
      MYSQL_PASSWORD: ${DATABASE_PASS}
      MYSQL_DATABASE: rest_with_spring_boot_erudio
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - erudio-network

  rest-with-spring-boot-erudio:
    image: alexandrerebechi/rest-with-spring-boot-erudio
    container_name: rest-with-spring-boot-erudio
    restart: always
    build: .
    working_dir: /rest-with-spring-boot-erudio/28_DockerizingOurApp
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: ${URL_DOCKER_DB}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    command: mvn spring-boot:run
    ports:
      - "80:80"
    depends_on:
      - db
    networks:
      - erudio-network

  react:
    image: react-erudio
    container_name: react-erudio
    restart: always
    build: ../client
    ports:
      - "3000:80"
    networks:
      - erudio-network

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - erudio-network

volumes:
  portainer_data:

networks:
  erudio-network:
    driver: bridge