name: Continuous Integration and Delivery with Github Actions

on:
  push:
    branches:
      - "main"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Setup Java 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Install fonts for JasperReports
      run: |
        sudo apt-get update
        sudo apt-get install -y fontconfig ttf-mscorefonts-installer
        sudo fc-cache -f -v       
        

    - name: Build Application .jar
      working-directory: ./28_DockerizingOurApp
      run: mvn clean package  -DforkCount=0 -e

    - name: Run tests
      run: mvn test -e

    - name: Show Surefire reports new
      if: always()
      run: |
        echo "===== SUREFIRE REPORTS ====="
        find target/surefire-reports -type f -name "*.txt" -print
        echo "===== FAILED TEST DETAILS ====="
        grep -R -A 20 -B 5 "Failures\|Errors\|Exception\|ERROR" target/surefire-reports/*.txt || true

    - name: Docker Compose Build
      working-directory: ./28_DockerizingOurApp
      run: docker compose build

    - name: Push to Docker Hub Container Resgistry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:latest ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:${{ github.run_id }} 
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/rest-with-spring-boot-erudio:${{ github.run_id }}
        
