services:
  db:
    image: mysql:9.7.2
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${DATABASE_DOCKER_ROOT_PASS}
      MYSQL_USER: ${DATABASE_DOCKER_USER}
      MYSQL_PASSWORD: ${DATABASE_DOCKER_PASS}
      MYSQL_DATABASE: wordpress
    ports:
      - 3308:3306
    networks:
      - wordpress-network
  wordpress:
    image: wordpress:6.9.4-php8.3-apache
    restart: always
    ports:
      - 80:80
    volumes:
      - ./config/php.conf.uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
      - ./wp-app:/var/www/html
    environment:
      TZ: America/Sao_Paulo
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: ${DATABASE_DOCKER_ROOT_PASS}
      WORDPRESS_DB_PASSWORD: ${DATABASE_DOCKER_PASS}
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      - db
    networks:
      - wordpress-network
networks:
  wordpress-network:
    driver: bridge