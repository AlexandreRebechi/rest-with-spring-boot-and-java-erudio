# ===================================================================
# SECURITY UPDATE: Credentials externalized to Environment Variables
# Prevented hardcoded sensitive data vulnerability.
# ===================================================================
cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.erudio.com.br
file:
  # Secure fallback to create a local directory if the UPLOAD_DIR variable is empty
  upload-dir: ${UPLOAD_DIR:./uploads}
spring:
  application:
    name: rest-with-spring-boot-and-java-erudio
  datasource:
    drive-class-name: com.mysql.cj.jdbc.Driver
    # If the DATABASE_USER variable does not exist in Windows, Spring falls back to 'root' as default
    url: ${URL_DB}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASS}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
  logging:
    level:
      root: INFO
      # root: WARM
      # com.example.erudio: DEBUG
  spring-doc:
    paths-to-math: /api/**/v1/**
    swagger-ui:
      use-root-path: true