server:
  port: 8888

cors:
  originPatterns: http://localhost:8080,http://localhost:3000,https://www.erudio.com.br
file:
  # Secure fallback to create a local directory if the UPLOAD_DIR variable is empty
  upload-dir: ${UPLOAD_DIR:./uploads}
spring:
  application:
    name: rest-with-spring-boot-and-java-erudio
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
  logging:
    level:
      root: INFO
      # root: WARM
      # com.example.erudio: DEBUG
  spring-doc:
    paths-to-math: /api/**/v1/**
    swagger-ui:
      use-root-path: true

