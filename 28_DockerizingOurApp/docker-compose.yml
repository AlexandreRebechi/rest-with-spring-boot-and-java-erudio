services:
  db:
    image: mysql:9.7.2
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASS}
      MYSQL_USER: ${DATABASE_DOCKER_USER}
      MYSQL_PASSWORD: ${DATABASE_PASS}
      MYSQL_DATABASE: rest_with_spring_boot_erudio
    ports:
      - "3308:3306"
    expose:
      - 3306
    networks:
      - erudio-network
  rest-with-spring-boot-erudio:
    image:  alexandrerebechi/rest-with-spring-boot-erudio
    restart: always
    build: .
    working_dir: /rest-with-spring-boot-erudio/28_DockerizingOurApp
    environment:
      TZ: America/Sao_Paulo
      spring.datasource.url: ${URL_DOCKER_DB}
      spring.datasource.username: ${DATABASE_USER}
      spring.datasource.password: ${DATABASE_PASS}
    command: mvn spring-boot:run
    ports:
      - "80:8888"
    depends_on:
      - db
    networks:
      - erudio-network
networks:
  erudio-network:
    driver: bridge